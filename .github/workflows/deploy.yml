name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify production database before publishing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python -m pip install -r scripts/requirements.txt
          python scripts/check_service.py

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install and build
        working-directory: frontend
        env:
          VITE_KAKAO_AUTH_READY: "true"
          VITE_EMAIL_AUTH_READY: ${{ vars.EMAIL_AUTH_READY == 'true' && 'true' || 'false' }}
          VITE_EMAIL_DELIVERY_READY: ${{ vars.EMAIL_DELIVERY_ENABLED == 'true' && 'true' || 'false' }}
          VITE_FULLTEXT_ORIGIN: ${{ vars.FULLTEXT_ORIGIN }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
