name: Manual Run

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'What to run'
        required: true
        type: choice
        options:
          - fetch-only
          - check-fulltext-queue
          - recommend-only
          - fetch-and-recommend
          - digest-only
          - repair-keywords
          - all

permissions:
  contents: read

concurrency:
  group: uro-daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -r scripts/requirements.txt

      - name: Fetch papers
        if: contains(fromJSON('["fetch-only","fetch-and-recommend","all"]'), github.event.inputs.task)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/fetch_papers.py

      - name: Classify papers
        if: contains(fromJSON('["fetch-and-recommend","all"]'), github.event.inputs.task)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/classify_papers.py

      - name: Check Z8 collection and Spark summaries
        if: github.event.inputs.task == 'check-fulltext-queue'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/check_fulltext_queue.py

      - name: Generate recommendations
        if: contains(fromJSON('["recommend-only","check-fulltext-queue","fetch-and-recommend","repair-keywords","all"]'), github.event.inputs.task)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/generate_recs.py

      - name: Repair historical keyword explanations
        if: github.event.inputs.task == 'repair-keywords'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/repair_keyword_reasons.py

      - name: Send email digests
        if: contains(fromJSON('["digest-only","all"]'), github.event.inputs.task)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
          APP_URL: ${{ vars.APP_URL }}
        run: python scripts/send_digest.py
