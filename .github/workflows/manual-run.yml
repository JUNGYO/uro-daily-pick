name: Manual Run

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'What to run'
        required: true
        type: choice
        options:
          - fetch-only
          - summarize-only
          - recommend-only
          - fetch-and-recommend
          - digest-only
          - fulltext-only
          - repair-keywords
          - all
      fulltext_pmid:
        description: 'Catalog PMID for fulltext-only; empty imports a bounded OA batch'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: uro-daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -r scripts/requirements.txt

      - name: Fetch papers
        if: contains(fromJSON('["fetch-only","fetch-and-recommend","all"]'), github.event.inputs.task)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/fetch_papers.py

      - name: Classify papers
        if: contains(fromJSON('["fetch-and-recommend","all"]'), github.event.inputs.task)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/classify_papers.py

      - name: Import open-access full texts
        if: github.event.inputs.task == 'fulltext-only' || (vars.FULLTEXT_IMPORT_ENABLED == 'true' && contains(fromJSON('["fetch-and-recommend","all"]'), github.event.inputs.task))
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FULLTEXT_BATCH_SIZE: ${{ vars.FULLTEXT_BATCH_SIZE }}
          IMPORT_PMID: ${{ inputs.fulltext_pmid }}
        run: |
          if [ -n "$IMPORT_PMID" ]; then
            python scripts/fulltext.py --pmid "$IMPORT_PMID" --provider oa --publish
          else
            python scripts/import_fulltexts.py
          fi

      - name: Summarize imported paper
        if: github.event.inputs.task == 'fulltext-only'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SUMMARY_BATCH_SIZE: ${{ vars.SUMMARY_BATCH_SIZE }}
          SUMMARY_PMID: ${{ inputs.fulltext_pmid }}
          SUMMARY_SOURCE: fulltext
        run: python scripts/summarize_papers.py

      - name: Summarize papers (Korean)
        if: contains(fromJSON('["summarize-only","fetch-and-recommend","all"]'), github.event.inputs.task)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SUMMARY_BATCH_SIZE: ${{ vars.SUMMARY_BATCH_SIZE }}
          SUMMARY_SOURCE: fulltext
        run: python scripts/summarize_papers.py

      - name: Generate recommendations
        if: contains(fromJSON('["recommend-only","fetch-and-recommend","repair-keywords","all"]'), github.event.inputs.task)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/generate_recs.py

      - name: Repair historical keyword explanations
        if: github.event.inputs.task == 'repair-keywords'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/repair_keyword_reasons.py

      - name: Send email digests
        if: contains(fromJSON('["digest-only","all"]'), github.event.inputs.task)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
          APP_URL: ${{ vars.APP_URL }}
        run: python scripts/send_digest.py
