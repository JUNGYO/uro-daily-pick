name: Initialize administrative metrics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uro-admin-metrics-initialization
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Initialize compact administrative metrics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/bootstrap_admin_metrics.py
